name: Deploy PlutonoC Astronomy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image builder
        run: python -m pip install Pillow==12.2.0
      - name: Verify JavaScript
        run: |
          node --check image-loader.js
          node --test tools/test-image-loading.cjs
          node --test tools/test-interaction-polish.cjs
          node --check script.js
          node --check admin.js
          node --check analytics.js
          node --check admin-analytics.js
          node --check admin-guestbook.js
          node --check guestbook-loader.js
          node tools/build-guestbook-ui.mjs --check
          node --check guestbook.js
          node --check guestbook-config.js
          node --check cloudfunctions/guestbook-shared/core.js
          node --test tools/test-guestbook.cjs
          node --check cloudfunctions/analytics-shared/core.js
          node --test tools/test-analytics.cjs
          node --test tools/test-reliability.cjs
          node --test tools/test-recovery.cjs
          node --check cloudfunctions/plutonoc-media/index.js
          node --test tools/test-media.cjs
          node --check cloudfunctions/plutonoc-content-publisher/index.js
          node --check cloudfunctions/plutonoc-content-publisher/content-runtime.js
          node tools/build-content.mjs --check
          python tools/build-first-view-assets.py --check
      - name: Verify static site
        run: |
          python tools/test-site-verifier.py
          python tools/verify-site.py --root .
      - name: Browser regression checks
        run: |
          export NODE_PATH="$RUNNER_TEMP/browser-tests/node_modules"
          npm install --prefix "$RUNNER_TEMP/browser-tests" --no-save --package-lock=false playwright@1.58.2
          node "$NODE_PATH/playwright/cli.js" install --with-deps chromium
          mkdir -p work
          python -m http.server 9011 --bind 127.0.0.1 > work/http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:9011/ > /dev/null && break || sleep 1; done
          node tools/test-mobile-layout-browser.cjs
          node tools/test-responsive-browser.cjs
          node tools/test-recovery-browser.cjs
          node tools/test-ending-browser.cjs
          node tools/test-site-dialogs-browser.cjs
          node tools/test-guestbook-browser.cjs
          node tools/test-media-admin-browser.cjs
          node tools/test-browser-zoom.cjs
          mv work "$RUNNER_TEMP/plutonoc-browser-results"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployment
        run: python tools/verify-site.py --url "${{ steps.deployment.outputs.page_url }}"
