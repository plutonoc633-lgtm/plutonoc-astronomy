<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050609"><meta name="description" content="PlutonoC 留言簿">
  <title>留言簿 — PlutonoC</title>
  <link rel="icon" href="assets/branding/favicon-32.png">
  <link rel="stylesheet" href="guestbook.css?v=20260914-book-layout-1">
  <script defer src="guestbook-loader.js?v=20260914-book-layout-1"></script>
</head>
<body class="book-page">
  <header class="book-header"><a href="./#home" aria-label="PlutonoC，返回网站"><img src="assets/branding/plutonoc-watermark-header.webp" width="128" height="35" alt="PlutonoC"></a><a href="./#home">返回网站 <span aria-hidden="true">↗</span></a></header>
  <main data-book-eager>
<!-- GUESTBOOK_START -->
<section class="book" id="guestbook" data-guestbook aria-labelledby="guestbook-title">
  <header class="book-heading"><h2 id="guestbook-title">留言</h2><span>GUESTBOOK</span></header>
  <form data-book-form>
    <fieldset disabled>
      <div class="book-identity"><label for="nickname">昵称</label><input id="nickname" name="nickname" autocomplete="nickname" maxlength="40" placeholder="访客（选填）" aria-label="昵称，选填，最多20字"></div>
      <label class="book-sr-only" for="message">留言正文，最多1000字</label><textarea id="message" name="body" rows="4" maxlength="2000" required placeholder="写下你的留言…" aria-describedby="message-count"></textarea>
      <div class="book-trap" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="book-form-foot"><span id="message-count" data-book-count>0 / 1000</span><button type="submit">提交留言 <span aria-hidden="true">↗</span></button></div>
    </fieldset>
    <p class="book-status" data-book-submit-status role="status"></p>
  </form>
  <div class="book-messages" aria-label="公开留言"><div data-book-list></div><p class="book-status" data-book-list-status role="status"></p><button type="button" data-book-more hidden>加载更多</button></div>
  <button class="book-loader-retry" type="button" data-book-loader-retry hidden>重新加载留言区</button>
  <noscript><p>请启用 JavaScript 后查看和提交留言。</p></noscript>
</section>
<!-- GUESTBOOK_END -->
  </main>
  <footer class="book-footer">© 2026 PLUTONOC</footer>
</body>
</html>
